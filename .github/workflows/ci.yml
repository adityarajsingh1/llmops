name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy llmops
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t llmops:ci .
      - name: Smoke test
        run: |
          docker run -d --name gw -p 8000:8000 -v "$PWD/gateway.example.yaml:/app/gateway.yaml:ro" llmops:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/v1/chat/completions \
            -H "Authorization: Bearer llmops-demo-key-do-not-use-in-prod" -H "Content-Type: application/json" \
            -d '{"model": "echo", "messages": [{"role": "user", "content": "hi"}]}'
          curl -sf localhost:8000/metrics | grep -q llmops_requests_total

  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check and unit-test the alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/rules" -w /rules \
            prom/prometheus:v3.5.0 check rules alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/rules" -w /rules \
            prom/prometheus:v3.5.0 test rules alerts.test.yml
