[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmops"
version = "0.1.0"
description = "A self-hosted gateway in front of LLM providers: budgets, prompt versions, tracing, metrics and evals."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aditya Raj Singh" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pyyaml>=6",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
llmops = "llmops.cli:main"

[project.urls]
Repository = "https://github.com/adityarajsingh1/llmops"

[tool.setuptools.packages.find]
include = ["llmops*"]

[tool.ruff]
line-length = 110
target-version = "py310"
# newer ruff also formats code blocks inside markdown; the README's aligned comments are on purpose
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
