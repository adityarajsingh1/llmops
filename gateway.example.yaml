# Copy to gateway.yaml (or point LLMOPS_CONFIG at it) and adjust.

providers:
  openai:
    type: openai
    api_key_env: OPENAI_API_KEY
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
  local:
    # any OpenAI-compatible server, e.g. ollama or vLLM
    type: openai
    options: {api_key: unused, base_url: "http://localhost:11434/v1"}
  demo:
    # no network and no key; echoes the last message back
    type: fake

# The model names clients send, and where each one goes.
# `price` is USD per million input/output tokens. The numbers below are
# placeholders to show the format: copy the real ones from your provider's
# pricing page. A model without a price counts as free in usage and budgets.
models:
  # if OpenAI is down (after retries), the same request goes to claude-haiku
  gpt-5-mini: {provider: openai, fallbacks: [claude-haiku], price: {input: 0.25, output: 2.0}}
  claude-haiku: {provider: anthropic, upstream: claude-haiku-4-5, price: {input: 1.0, output: 5.0}}
  llama3: {provider: local, upstream: "llama3.1:8b"}
  echo: {provider: demo}

# One entry per team. Make a key with `llmops keys new <team>`: the key goes to
# the team, only its hash goes here.
teams:
  - name: demo
    # the key for this hash is: llmops-demo-key-do-not-use-in-prod
    key_sha256: 3bd90f79c958a01cd4fee01778560adce98eac34e4c0f5e8185b5edda8bac6b4
    models: [echo]
  # - name: search
  #   key_sha256: ...
  #   budget:
  #     monthly_usd: 200
  #     on_exceed: block   # or warn: let requests through, with a warning header
  #     warn_at: 0.8       # responses carry a warning header from 80% of the budget
  #   rate_limit:
  #     requests_per_minute: 120
  #     burst: 20          # back-to-back requests allowed; default a tenth of the minute

# Optional; these are the defaults.
reliability:
  retry:
    attempts: 3        # tries per model, the first one included
    base_delay: 0.25   # seconds; doubles each retry, with jitter
    max_delay: 4.0
    timeout: 30.0      # seconds per try
  breaker:
    failure_threshold: 5   # failures in a row before a provider is skipped
    reset_seconds: 30      # then one trial request is let through

# Optional response cache, off by default.
cache:
  enabled: false
  ttl_seconds: 3600
  max_entries: 10000
  cache_nondeterministic: false   # by default only requests with temperature 0 are cached
  shared_across_teams: false      # entries are per team unless this is on
  semantic:
    enabled: false
    threshold: 0.9                # cosine similarity needed to reuse an answer
    embedder: hashing             # built in, no network; or `openai` (text-embedding-3-small)
    # options: {model: text-embedding-3-small}

# Optional quality monitoring on live answers, off by default (sample_rate 0).
# Samples contain model output, so check what your users send before turning it on.
monitoring:
  sample_rate: 0.0
  monitors:
    - name: support-no-made-up-prices
      prompt: support-reply      # or model: <name>; with neither, every sampled answer
      checks:
        - {type: regex, pattern: '[$€£]\s?\d', must_match: false}
